services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nids
      POSTGRES_PASSWORD: nids
      POSTGRES_DB: nids
    volumes:
      - nids_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nids -d nids"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NIDS_DATABASE_URL: postgresql+asyncpg://nids:nids@postgres:5432/nids
    entrypoint: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build: .
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NIDS_ENVIRONMENT: production
      NIDS_DATABASE_URL: postgresql+asyncpg://nids:nids@postgres:5432/nids
      NIDS_API_CORS_ORIGINS: '["http://localhost:5173"]'
      NIDS_ML_MODEL_PATH: /app/models/anomaly_model.joblib
    volumes:
      - ./models:/app/models:ro
    ports:
      - "8000:8000"
    # Only needed for live capture; harmless to leave on otherwise. Note
    # what this does *not* get you: on the default bridge network below,
    # the container can only sniff its own virtual veth interface, not
    # the host's real NICs — actually seeing host traffic needs
    # `network_mode: host` too, which in turn only works this way on
    # native Linux Docker hosts (it puts the container in the *engine
    # host's* network namespace). On Docker Desktop (Windows/Mac, where
    # the engine runs inside a VM) `network_mode: host` was tried here
    # and confirmed broken two different ways: the API stopped being
    # reachable at localhost:8000 from the actual host at all, and it
    # silently lost the ability to resolve the `postgres` hostname (no
    # compose-network DNS in host mode) — invisible at startup because
    # NIDS_ENVIRONMENT=production skips the dev-mode DB probe that would
    # have logged it, so every DB-backed request would have failed at
    # request time instead. Bridge + explicit ports, as below, is what
    # actually works out of the box everywhere; pcap replay (the
    # documented default demo path) needs none of this anyway.
    cap_add:
      - NET_RAW
      - NET_ADMIN

  dashboard:
    build:
      context: ./dashboard
      # Vite inlines VITE_* vars into the static bundle at build time, so
      # this has to be a build arg, not a container `environment:` — the
      # latter would have zero effect on the already-built JS. Override
      # with `docker compose build --build-arg VITE_API_BASE_URL=...` (or
      # edit this default) if the API isn't reachable at localhost:8000
      # from wherever the dashboard is opened.
      args:
        VITE_API_BASE_URL: http://localhost:8000
    init: true
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  nids_pg_data:
