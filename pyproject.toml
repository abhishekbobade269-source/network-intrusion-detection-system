[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nids"
version = "0.1.0"
description = "Hybrid (signature + ML) Network Intrusion Detection System — live capture, offline pcap/dataset replay, FastAPI alerting API, PostgreSQL-backed alert store."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Abhishek Bobade" }]
keywords = ["nids", "ids", "intrusion-detection", "network-security", "machine-learning", "fastapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
  "scapy>=2.6.1",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.2",
  "sqlalchemy>=2.0.35",
  "asyncpg>=0.29.0",
  "psycopg[binary]>=3.2.3",
  "alembic>=1.13.3",
  "scikit-learn>=1.5.2",
  "pandas>=2.2.3",
  "numpy>=1.26.4,<2.0",
  "joblib>=1.4.2",
  "pyyaml>=6.0.2",
  "structlog>=24.4.0",
  "httpx>=0.27.2",
  "python-dotenv>=1.0.1",
  "slowapi>=0.1.9",
  "websockets>=13.1",
  "rich>=13.9.2",
  "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.9",
  "mypy>=1.11.2",
  "bandit>=1.7.10",
  "pip-audit>=2.7.3",
  "pre-commit>=3.8.0",
  "types-PyYAML>=6.0.12.20240917",
  "faker>=30.3.0",
]

[project.scripts]
nids = "nids.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nids"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "S"]
# S101: asserts are fine in tests. S104: 0.0.0.0 bind is deliberate (containerized API).
# B008: FastAPI's Depends()/typer's Option()/Argument() as a default value is the
# idiomatic pattern for both frameworks' dependency injection, not a real footgun here.
ignore = ["S101", "S104", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]

[tool.mypy]
python_version = "3.11"
packages = ["nids"]
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=nids --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole test session, not one per test function.
# nids.db.session.init_engine()/get_sessionmaker() are @lru_cache'd (by
# design — the app is a long-running server process with one engine for
# its lifetime), so their pooled asyncpg connections get bound to
# whichever event loop was running the first time a test called them. A
# per-function loop scope tears that loop down after each test, and the
# next DB-touching test then tries to clean up / reuse a connection on an
# already-closed loop ("Event loop is closed" / "'NoneType' object has no
# attribute 'send'" from asyncpg). Session-scoped loops match the cached
# engine's actual lifetime assumption instead of fighting it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["src/nids"]
omit = ["*/tests/*"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# B101: the one `assert` is a type-narrowing invariant check, not validation.
# B104: 0.0.0.0 bind is deliberate — this runs as a containerized API service.
skips = ["B101", "B104"]
