name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: nids-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: bandit -c pyproject.toml -r src
      - run: pip-audit --strict --progress-spinner=off || pip-audit --progress-spinner=off
        continue-on-error: true # dependency advisories shouldn't block CI; reviewed manually

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nids
          POSTGRES_PASSWORD: nids
          POSTGRES_DB: nids
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nids -d nids"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NIDS_ENVIRONMENT: test
      NIDS_DATABASE_URL: postgresql+asyncpg://nids:nids@localhost:5432/nids
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - name: Run Alembic migrations
        run: alembic upgrade head
      - name: Run tests with coverage
        run: pytest --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nids:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
